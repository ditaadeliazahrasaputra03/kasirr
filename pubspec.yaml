name: pos_kasir
description: "Aplikasi Point of Sale (POS) sederhana - Mini Project Mobile Apps. Admin CRUD menu, Kasir transaksi, pembayaran via MiomiPay, data real-time di Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Firebase: Authentication + Cloud Firestore (real-time database)
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.0
  # HTTP untuk memanggil API Payment Gateway MiomiPay
  http: ^1.3.0
  # Membuka halaman pembayaran MiomiPay di browser
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
